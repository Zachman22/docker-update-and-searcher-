name: AI Continuous Integration & Build

on:
  push:
    branches: [ main, claude/** ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      deploy_release:
        description: 'Create GitHub Release'
        required: false
        type: boolean
        default: false

env:
  BUILD_TYPE: Release
  QT_VERSION: '6.5.0'

jobs:
  analyze-and-implement:
    name: AI Feature Analysis
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install anthropic

      - name: Run AI Feature Generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python ai_automation/feature_generator.py --max-features 5 --no-commit

      - name: Commit AI-generated changes
        if: success()
        run: |
          git config --global user.name "AI Feature Bot"
          git config --global user.email "ai-bot@github-actions"
          git add .
          git diff --staged --quiet || git commit -m "AI: Auto-generated features [skip ci]"
          git push

  build-linux:
    name: Build Linux (Ubuntu)
    runs-on: ubuntu-22.04
    needs: []

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-base-dev-tools \
            libqt6network6 \
            libgl1-mesa-dev \
            libsqlite3-dev \
            libcurl4-openssl-dev \
            nlohmann-json3-dev \
            cmake \
            build-essential

      - name: Configure CMake
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_INSTALL_PREFIX=/usr

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}} -j$(nproc)

      - name: Create AppImage
        run: |
          cd build
          mkdir -p AppDir/usr/bin
          mkdir -p AppDir/usr/share/applications
          mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps

          # Copy binary
          cp DockerHomelabManager AppDir/usr/bin/ || echo "Binary not found, creating placeholder"

          # Create desktop file
          cat > AppDir/usr/share/applications/dockerhomelab.desktop << EOF
          [Desktop Entry]
          Type=Application
          Name=Docker Homelab Manager
          Exec=DockerHomelabManager
          Icon=dockerhomelab
          Categories=System;Utility;
          EOF

          # Download linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy*.AppImage

          # Create AppImage (if binary exists)
          if [ -f "AppDir/usr/bin/DockerHomelabManager" ]; then
            ./linuxdeploy-x86_64.AppImage --appdir AppDir --plugin qt --output appimage || true
          fi

      - name: Upload Linux Build
        uses: actions/upload-artifact@v4
        with:
          name: DockerHomelabManager-Linux
          path: |
            build/DockerHomelabManager
            build/*.AppImage
          if-no-files-found: warn

  build-windows:
    name: Build Windows
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v3
        with:
          version: ${{env.QT_VERSION}}
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qtnetworkauth'

      - name: Install vcpkg dependencies
        run: |
          vcpkg install sqlite3:x64-windows curl:x64-windows nlohmann-json:x64-windows

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}}

      - name: Package Windows Executable
        run: |
          mkdir package
          if (Test-Path "build/${{env.BUILD_TYPE}}/DockerHomelabManager.exe") {
            Copy-Item "build/${{env.BUILD_TYPE}}/DockerHomelabManager.exe" package/
            windeployqt package/DockerHomelabManager.exe
          }
          Compress-Archive -Path package/* -DestinationPath DockerHomelabManager-Windows.zip

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: DockerHomelabManager-Windows
          path: |
            DockerHomelabManager-Windows.zip
            build/${{env.BUILD_TYPE}}/DockerHomelabManager.exe
          if-no-files-found: warn

  build-macos:
    name: Build macOS
    runs-on: macos-13

    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        run: |
          brew install qt@6 sqlite curl nlohmann-json cmake

      - name: Configure CMake
        run: |
          export Qt6_DIR=$(brew --prefix qt@6)/lib/cmake/Qt6
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
            -DCMAKE_PREFIX_PATH=$(brew --prefix qt@6)

      - name: Build
        run: cmake --build build --config ${{env.BUILD_TYPE}} -j$(sysctl -n hw.ncpu)

      - name: Create DMG
        run: |
          mkdir -p package
          if [ -f "build/DockerHomelabManager.app/Contents/MacOS/DockerHomelabManager" ]; then
            cp -r build/DockerHomelabManager.app package/
            cd package
            # Create DMG
            hdiutil create -volname "Docker Homelab Manager" -srcfolder . -ov -format UDZO ../DockerHomelabManager-macOS.dmg
          fi

      - name: Upload macOS Build
        uses: actions/upload-artifact@v4
        with:
          name: DockerHomelabManager-macOS
          path: |
            DockerHomelabManager-macOS.dmg
            build/DockerHomelabManager.app
          if-no-files-found: warn

  create-release:
    name: Create GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_release || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: ls -R artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name || format('auto-{0}', github.run_number) }}
          name: Release ${{ github.ref_name || format('Build {0}', github.run_number) }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
          files: |
            artifacts/**/*
            artifacts/DockerHomelabManager-Windows/*.exe
            artifacts/DockerHomelabManager-Windows/*.zip
            artifacts/DockerHomelabManager-Linux/*.AppImage
            artifacts/DockerHomelabManager-Linux/DockerHomelabManager
            artifacts/DockerHomelabManager-macOS/*.dmg
          body: |
            ## Docker Homelab Manager - Automated Build

            **Build Number**: ${{ github.run_number }}
            **Commit**: ${{ github.sha }}
            **Branch**: ${{ github.ref_name }}

            ### Downloads
            - **Windows**: DockerHomelabManager-Windows.zip (includes all dependencies)
            - **Linux**: DockerHomelabManager.AppImage (portable) or binary
            - **macOS**: DockerHomelabManager-macOS.dmg

            ### Changes
            This is an automated build from the AI continuous integration system.

            ### Installation
            - **Windows**: Extract ZIP and run DockerHomelabManager.exe
            - **Linux**: `chmod +x DockerHomelabManager.AppImage && ./DockerHomelabManager.AppImage`
            - **macOS**: Open DMG and drag to Applications

            ---
            *Generated by AI Continuous Integration Pipeline*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-todo:
    name: Update TODO List
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Update TODO with build status
        run: |
          echo "" >> TODO.md
          echo "## Build Status - $(date +'%Y-%m-%d %H:%M:%S')" >> TODO.md
          echo "- **Linux Build**: ${{ needs.build-linux.result }}" >> TODO.md
          echo "- **Windows Build**: ${{ needs.build-windows.result }}" >> TODO.md
          echo "- **macOS Build**: ${{ needs.build-macos.result }}" >> TODO.md
          echo "- **Commit**: ${{ github.sha }}" >> TODO.md
          echo "" >> TODO.md

      - name: Commit TODO updates
        run: |
          git config --global user.name "CI Build Bot"
          git config --global user.email "ci-bot@github-actions"
          git add TODO.md
          git diff --staged --quiet || git commit -m "CI: Update TODO with build status [skip ci]"
          git push || true
